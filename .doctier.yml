version: 1

# .rubstack/ is the private doc store: encrypted in git, decrypted on checkout.
# Prototype/spike code is sensitive scratch: never committed, dies with the worktree.
docs:
  # Entry points first (first match wins): listed individually in the agent index.
  - path: ".rubstack/engineering/architecture.md"
    visibility: public
    lifetime: durable
    primary: true

  - path: ".rubstack/engineering/implementation-plan.md"
    visibility: public
    lifetime: durable
    primary: true

  - path: ".rubstack/product/product.md"
    visibility: public
    lifetime: durable
    primary: true

  - path: ".rubstack/**"
    visibility: private
    lifetime: durable

  - path: "**/_prototype-*"
    visibility: private
    lifetime: ephemeral
    sensitive: true

  - path: "**/_spike/**"
    visibility: private
    lifetime: ephemeral
    sensitive: true

recipients_file: .doctier/recipients.txt
